<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GifSweeper</title>
    <style>
        body { margin: 0; background-color: #008080; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; font-family: 'MS Sans Serif', Arial, sans-serif; }
        .window { background-color: #c0c0c0; border: 2px solid; border-color: #ffffff #808080 #808080 #ffffff; padding: 3px; display: flex; flex-direction: column; gap: 2px; user-select: none; width: 500px; }
        .title-bar { background: linear-gradient(90deg, #000080, #1084d0); padding: 3px 5px; display: flex; justify-content: space-between; align-items: center; color: white; font-weight: bold; font-size: 12px; }
        .url-bar { display: flex; gap: 2px; padding: 4px; background: #c0c0c0; border-bottom: 1px solid #808080; }
        .win-input { border: 2px solid; border-color: #808080 #ffffff #ffffff #808080; font-size: 11px; padding: 2px; flex-grow: 1; outline: none; }
        .status-panel { border: 2px solid; border-color: #808080 #ffffff #ffffff #808080; margin: 4px; padding: 6px; display: flex; justify-content: space-between; align-items: center; }
        .led-display { background-color: black; color: #ff0000; font-family: monospace; font-size: 20px; padding: 2px 5px; border: 1px solid #808080; min-width: 45px; text-align: center; }
        .smiley-btn { width: 34px; height: 34px; border: 2px solid; border-color: #ffffff #808080 #808080 #ffffff; display: flex; justify-content: center; align-items: center; cursor: pointer; font-size: 20px; background-color: #c0c0c0; outline: none; }
        .game-area { border: 3px solid; border-color: #808080 #ffffff #ffffff #808080; height: 500px; background-color: #bdbdbd; display: flex; justify-content: center; align-items: center; overflow: hidden; position: relative; }
        canvas { max-width: 100%; max-height: 100%; image-rendering: pixelated; cursor: crosshair; }
        .win-btn { background-color: #c0c0c0; border: 2px solid; border-color: #ffffff #808080 #808080 #ffffff; padding: 4px 10px; font-size: 11px; font-weight: bold; cursor: pointer; outline: none; }
        .win-btn:active { border-color: #808080 #ffffff #ffffff #808080; }
        .win-btn.recording { color: #ff0000 !important; border-color: #808080 #ffffff #ffffff #808080; background: #e0e0e0; }
        .color-slots { display: flex; gap: 8px; align-items: center; }
        .slot { width: 22px; height: 22px; background: #bdbdbd; border: 1px solid #7b7b7b; display: flex; justify-content: center; align-items: center; }
        .mine-shape { width: 12px; height: 12px; background: #ffffff; border-radius: 50%; position: relative; }
        .mine-shape::before { content: ''; position: absolute; background: inherit; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 18px; height: 2px; }
        .mine-shape::after { content: ''; position: absolute; background: inherit; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 2px; height: 18px; }
        .label-text { font-size: 10px; color: #000; font-weight: bold; }

        @media (max-width: 600px) {
            body { height: 100dvh; }
            .window { width: 100%; box-sizing: border-box; }
            .game-area { height: 50dvh; }
            .status-panel { flex-wrap: wrap; gap: 6px; }
            .win-btn, .smiley-btn { min-height: 44px; min-width: 44px; }
            .win-input { font-size: 16px; }
            .slot { width: 30px; height: 30px; }
        }
    </style>
    <script src="https://unpkg.com/gifler@0.1.0/gifler.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>
</head>
<body>

<div class="window">
    <div class="title-bar">
        <span>GifSweeper</span>
        <div style="display:flex; gap:2px;">
            <button class="win-btn" id="btn-reset-canvas">_</button>
            <button class="win-btn" id="btn-close-file">X</button>
        </div>
    </div>

    <div class="url-bar">
        <input type="text" id="urlInput" class="win-input" placeholder="Paste GIF URL...">
        <button class="win-btn" id="loadUrlBtn">GET</button>
    </div>

    <div class="status-panel">
        <div style="display:flex; gap: 5px; align-items: center;">
            <div class="led-display" id="numDisplay">040</div>
            <button class="win-btn" onclick="document.getElementById('fileInput').click()">LOAD</button>
        </div>
        <button class="smiley-btn" id="changeEffectBtn">😊</button>
        <div style="display:flex; gap: 5px; align-items: center;">
            <button class="win-btn" id="saveBtn">GIF</button>
            <button class="win-btn" id="saveWebmBtn">WEBM</button>
            <div class="led-display" id="effect-code">CPY</div>
        </div>
    </div>

    <div class="game-area">
        <canvas id="mainCanvas"></canvas>
    </div>
    <input type="file" id="fileInput" accept="image/gif" style="display: none;">

    <div style="padding: 8px 4px; display: flex; flex-direction: column; gap: 6px;">
        <div style="display:flex; justify-content: space-between; align-items: center;">
            <div class="color-slots">
                <span class="label-text">MINES:</span>
                <div class="slot"><div class="mine-shape" id="ms0"></div></div>
                <div class="slot"><div class="mine-shape" id="ms1"></div></div>
                <div class="slot"><div class="mine-shape" id="ms2"></div></div>
            </div>
            <span class="label-text" id="effectName">copy</span>
        </div>
        <input type="range" id="keySlider" min="0" max="100" value="40">
    </div>
</div>

<script>
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const fileInput = document.getElementById('fileInput');
    const urlInput = document.getElementById('urlInput');
    const keySlider = document.getElementById('keySlider');
    const numDisplay = document.getElementById('numDisplay');
    const effectDisplay = document.getElementById('effectName');
    const effectCode = document.getElementById('effect-code');
    const changeEffectBtn = document.getElementById('changeEffectBtn');
    const saveBtn = document.getElementById('saveBtn');
    const saveWebmBtn = document.getElementById('saveWebmBtn');

    const effects = ['copy', 'darker', 'source-over', 'source-out', 'destination-over', 'destination-out'];
    const codes = ["CPY", "DRK", "OVR", "OUT", "DST", "DTO"];
    const faceEmojis = ["😊", "😎", "😮", "😵", "😈", "🤑"];
    const DEFAULT_SHEET = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAgAAAAAwCAIAAADo/1UpAAACWElEQVR42u3dTU7DMBAG0KTqQbhZuQlwk/ZeLLhJWCChqoTEbR1nbL8nNvwIxSNnPrs0ZhyG9wGA/hyUAEAAACAAABAAAAgAAAQAAAIAAAEAgAAAILbj6k9M09v1p+P4oWoADRgXjoK4af1iAKCLAFjo/rVngD0N0I+FjjcfAKvdv9LWaU8DdNv6/3a8o1r8fteeBnTMZm6llI43swNIXP7XVSB7GqCfWymx40XcAZzPL9efvr5+RS70jlf7wJ6mltr+DO1yudQyE/qctGXWywVqm+vlgbqmwfzfAPbdAdxUMEsdtxvRFle73Z5mx6t9YFw33T/yHVVFYfNebbH1coHa5np5IM40SO94h/hTc+Hrrraxq13u/jFrm17YaXq7/qh3Gqyulzu8xerqBhEDYLlS0eq479Wm32M/P1lFbVe7f8CZkFjY2Y5fPgayTIOUa84yrjKT9t5bqYHetRIA6Ts4f2aEOOtlcBYQDXbJtsdV0dizrJeJHgApS/uKlv/2NEA/0vvY4bFfoVGCDRD1nwU0TaoA4DC4oe23VGd/87LnALYbzux7gU6nU8AN6H+FjflQ/TPToPyIPAewaccLFwAFnqbL+/hi2CeBZ4cW+UnF1QyI2f0XChv2VJVnpkH5U1V2fxI4fTgx76+7TwNlcICJ85rKvrLvWC230uAlIHo+wrC9/0LRZLv0z0IEAFiIWS97i6AAAAsx62WtXwAA1ssIAMB6GQEAwOAwOAAEAAACAAABAEAR4/SpCAB2AAAIAAAEAAACAAABAIAAAEAAACAAABAAAITzDZZanXyulx0SAAAAAElFTkSuQmCC';
    const DEFAULT_FRAME_COUNT = 8;
    const DEFAULT_FRAME_DELAY = 130;

    let effectIndex = 0;
    let targetColors = [null, null, null];
    let colorIndex = 0;
    let animHandle = null;
    let defaultAnim = null;
    let sourceGeneration = 0;
    let activeFile = false;
    let gifEncoder = null;
    let gifEncoderSize = null;
    let gifCapturing = false;
    let mediaRecorder = null;
    let recordedChunks = [];
    let workerUrlPromise = null;

    const playbackCanvas = document.createElement('canvas');
    const playbackCtx = playbackCanvas.getContext('2d', { willReadFrequently: true });
    const tempCanvas = document.createElement('canvas');
    const tCtx = tempCanvas.getContext('2d', { willReadFrequently: true });

    function stopAnim() {
        sourceGeneration++;
        if (animHandle) {
            try { animHandle.stop(); } catch (e) {}
            animHandle = null;
        }
        if (defaultAnim !== null) {
            cancelAnimationFrame(defaultAnim);
            defaultAnim = null;
        }
    }

    function stopEncoders() {
        if (gifEncoder) {
            try { gifEncoder.terminate(); } catch (e) {}
            gifEncoder = null;
            gifEncoderSize = null;
        }
        gifCapturing = false;
        if (mediaRecorder && mediaRecorder.state !== 'inactive') {
            try { mediaRecorder.stop(); } catch (e) {}
        }
        mediaRecorder = null;
        recordedChunks = [];
        saveBtn.classList.remove('recording');
        saveBtn.textContent = "GIF";
        saveWebmBtn.classList.remove('recording');
        saveWebmBtn.textContent = "WEBM";
    }

    function closeAndClear() {
        activeFile = false;
        stopAnim();
        stopEncoders();
        fileInput.value = "";
        urlInput.value = "";
        targetColors = [null, null, null];
        playbackCtx.clearRect(0, 0, playbackCanvas.width, playbackCanvas.height);
        ctx.globalCompositeOperation = 'source-over';
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        document.querySelectorAll('.mine-shape').forEach(m => m.style.background = '#ffffff');
        effectCode.textContent = codes[effectIndex];
    }

    document.getElementById('btn-reset-canvas').onclick = () => {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        targetColors = [null, null, null];
        document.querySelectorAll('.mine-shape').forEach(m => m.style.background = '#ffffff');
        colorIndex = 0;
    };

    document.getElementById('btn-close-file').onclick = closeAndClear;

    changeEffectBtn.onclick = () => {
        effectIndex = (effectIndex + 1) % effects.length;
        effectDisplay.textContent = effects[effectIndex];
        effectCode.textContent = codes[effectIndex];
        changeEffectBtn.textContent = faceEmojis[effectIndex];
    };

    keySlider.oninput = (e) => { numDisplay.textContent = e.target.value.padStart(3, '0'); };

    canvas.addEventListener('mousedown', (e) => {
        if (!activeFile) return;
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX - rect.left) * (canvas.width / rect.width);
        const y = (e.clientY - rect.top) * (canvas.height / rect.height);
        const pixel = ctx.getImageData(x, y, 1, 1).data;
        targetColors[colorIndex] = { r: pixel[0], g: pixel[1], b: pixel[2] };
        document.getElementById(`ms${colorIndex}`).style.background = `rgb(${pixel[0]},${pixel[1]},${pixel[2]})`;
        colorIndex = (colorIndex + 1) % 3;
    });

    const startGifler = (source) => {
        closeAndClear();
        activeFile = true;
        const generation = sourceGeneration;
        gifler(source).frames(playbackCanvas, function (c, frame) {
            if (!activeFile || generation !== sourceGeneration) {
                try { this.stop(); } catch (e) {}
                return;
            }
            animHandle = this;
            playbackCtx.globalCompositeOperation = 'source-over';
            playbackCtx.drawImage(frame.buffer, frame.x || 0, frame.y || 0);
            renderEngine();
            if (gifEncoder) captureFrame(frame.delay || 60);
        }, true);
    };

    fileInput.onchange = (e) => { if (e.target.files[0]) startGifler(URL.createObjectURL(e.target.files[0])); };
    document.getElementById('loadUrlBtn').onclick = () => { if (urlInput.value.trim()) startGifler(urlInput.value.trim()); };

    function renderEngine() {
        if (!activeFile) return;
        if (canvas.width !== playbackCanvas.width || canvas.height !== playbackCanvas.height) {
            canvas.width = tempCanvas.width = playbackCanvas.width;
            canvas.height = tempCanvas.height = playbackCanvas.height;
        }

        tCtx.clearRect(0, 0, tempCanvas.width, tempCanvas.height);
        tCtx.drawImage(playbackCanvas, 0, 0);

        const imgData = tCtx.getImageData(0, 0, tempCanvas.width, tempCanvas.height);
        const data = imgData.data;
        const threshold = (parseInt(keySlider.value) / 100) * 255;
        const currentEffect = effects[effectIndex];

        for (let i = 0; i < data.length; i += 4) {
            const r = data[i], g = data[i+1], b = data[i+2];
            const luma = r * 0.299 + g * 0.587 + b * 0.114;
            let makeTransparent = luma < threshold;

            for (let col of targetColors) {
                if (col) {
                    const diff = Math.abs(r - col.r) + Math.abs(g - col.g) + Math.abs(b - col.b);
                    if (diff < 50) { makeTransparent = true; break; }
                }
            }
            if (makeTransparent) data[i + 3] = 0;
            else if (currentEffect === 'darker') {
                data[i] *= 0.5; data[i+1] *= 0.5; data[i+2] *= 0.5;
            }
        }
        tCtx.putImageData(imgData, 0, 0);
        ctx.globalCompositeOperation = (currentEffect === 'copy' || currentEffect === 'darker') ? 'source-over' : currentEffect;
        ctx.drawImage(tempCanvas, 0, 0);
    }

    function getWorkerUrl() {
        if (!workerUrlPromise) {
            workerUrlPromise = fetch('https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.worker.js')
                .then(resp => {
                    if (!resp.ok) throw new Error('gif worker no disponible');
                    return resp.blob();
                })
                .then(blob => URL.createObjectURL(blob))
                .catch(err => { workerUrlPromise = null; throw err; });
        }
        return workerUrlPromise;
    }

    function captureFrame(delay) {
        if (gifCapturing && gifEncoder && gifEncoderSize &&
            gifEncoderSize.width === canvas.width && gifEncoderSize.height === canvas.height) {
            gifEncoder.addFrame(ctx, { copy: true, delay: delay });
        }
    }

    saveBtn.onclick = async () => {
        if (!activeFile) return;
        if (gifEncoder) {
            gifCapturing = false;
            gifEncoder.on('finished', (blob) => {
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = 'GifSweeper_Output.gif';
                a.click();
                setTimeout(() => URL.revokeObjectURL(a.href), 1000);
                gifEncoder = null;
                gifEncoderSize = null;
                gifCapturing = false;
                saveBtn.textContent = "GIF";
                saveBtn.classList.remove('recording');
                effectCode.textContent = codes[effectIndex];
            });
            gifEncoder.render();
            saveBtn.textContent = "WAIT";
            return;
        }

        if (mediaRecorder) return;
        try {
            const workerScript = await getWorkerUrl();
            gifEncoder = new GIF({
                workers: 2,
                quality: 10,
                width: canvas.width,
                height: canvas.height,
                workerScript,
                transparent: 'rgba(0,0,0,0)'
            });
            gifEncoderSize = { width: canvas.width, height: canvas.height };
            gifCapturing = true;
            saveBtn.textContent = "STOP";
            saveBtn.classList.add('recording');
            effectCode.textContent = "REC";
        } catch (err) {
            saveBtn.textContent = "GIF";
            effectCode.textContent = "ERR";
        }
    };

    saveWebmBtn.onclick = () => {
        if (!activeFile) return;
        if (mediaRecorder) {
            mediaRecorder.stop();
            return;
        }
        recordedChunks = [];
        const stream = canvas.captureStream(30);
        const options = { mimeType: 'video/webm;codecs=vp8', videoBitsPerSecond: 2500000 };
        try {
            mediaRecorder = new MediaRecorder(stream, options);
        } catch (e) {
            mediaRecorder = new MediaRecorder(stream);
        }
        mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };
        mediaRecorder.onstop = () => {
            const blob = new Blob(recordedChunks, { type: 'video/webm' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'GifSweeper_Output.webm';
            a.click();
            setTimeout(() => URL.revokeObjectURL(a.href), 1000);
            mediaRecorder = null;
            saveWebmBtn.textContent = "WEBM";
            saveWebmBtn.classList.remove('recording');
            effectCode.textContent = codes[effectIndex];
        };
        mediaRecorder.start();
        saveWebmBtn.textContent = "STOP";
        saveWebmBtn.classList.add('recording');
        effectCode.textContent = "REC";
    };

    function startDefaultSequence() {
        closeAndClear();
        activeFile = true;
        const generation = sourceGeneration;
        const sheet = new Image();
        sheet.onload = () => {
            if (!activeFile || generation !== sourceGeneration) return;
            const frameWidth = sheet.width / DEFAULT_FRAME_COUNT;
            const frameHeight = sheet.height;
            let index = 0;
            let last = 0;
            const step = (timestamp) => {
                if (!activeFile || generation !== sourceGeneration) return;
                if (timestamp - last >= DEFAULT_FRAME_DELAY) {
                    last = timestamp;
                    if (playbackCanvas.width !== frameWidth || playbackCanvas.height !== frameHeight) {
                        playbackCanvas.width = frameWidth;
                        playbackCanvas.height = frameHeight;
                    }
                    playbackCtx.globalCompositeOperation = 'source-over';
                    playbackCtx.clearRect(0, 0, frameWidth, frameHeight);
                    playbackCtx.drawImage(sheet, index * frameWidth, 0, frameWidth, frameHeight, 0, 0, frameWidth, frameHeight);
                    renderEngine();
                    if (gifEncoder) captureFrame(DEFAULT_FRAME_DELAY);
                    index = (index + 1) % DEFAULT_FRAME_COUNT;
                }
                defaultAnim = requestAnimationFrame(step);
            };
            defaultAnim = requestAnimationFrame(step);
        };
        sheet.src = DEFAULT_SHEET;
    }

    startDefaultSequence();
</script>
</body>
</html>
